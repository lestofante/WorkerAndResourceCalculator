<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Chain Calculator</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        .node rect { fill: steelblue; rx: 20; ry: 20; cursor: grab; }
        .link { stroke: black; stroke-width: 2px; }
        text { font-size: 12px; text-anchor: middle; fill: white; }
        .label { fill: black; font-size: 10px; }
        #controls { position: absolute; top: 10px; left: 10px; background: white; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="controls">
        <label for="resource">Select Resource and quantity:</label>
        <select id="resource"></select>
        <input id="quantity" type="number"></input>
        <button onclick="updateGraph()">Generate</button>
    </div>
    <svg width="100%" height="100%"></svg>
    <script>
        const width = window.innerWidth, height = window.innerHeight;
        const svg = d3.select("svg").attr("width", width).attr("height", height);
        let buildingsMapByOutput = {};

        function parseCSV(data) {
            buildingsMapByOutput = {};
            const parsedData = Papa.parse(data, { header: true, skipEmptyLines: true, delimiter: ";" }).data;
            parsedData.forEach(row => {
                //console.log("found "+JSON.stringify(row));
                let inputs = [];
                for (let i = 1; i <= 5; i++) {
                    if (row[`Input ${i}`] && row[`No. ${i}`]) {
                        inputs.push({ name: row[`Input ${i}`], qty: parseFloat(row[`No. ${i}`]) });
                    }
                }
                let outputs = [];
                for (let i = 1; i <= 2; i++) {
                    if (row[`Output ${i}`] && row[`oNo. ${i}`]) {
                        outputs.push({ name: row[`Output ${i}`], qty: parseFloat(row[`oNo. ${i}`]) });
                    }
                }
                outputs.forEach(output => {
                    if (!buildingsMapByOutput[output.name]) buildingsMapByOutput[output.name] = [];
                    buildingsMapByOutput[output.name].push({ id: row.Building, inputs, output });
                });
                //console.log("CREATED "+JSON.stringify(row));
            });
            populateResourceDropdown();
        }

        function populateResourceDropdown() {
            const resourceSelect = document.getElementById("resource");
            resourceSelect.innerHTML = "";
            Object.keys(buildingsMapByOutput).sort().forEach(resource => {
                let option = document.createElement("option");
                option.value = resource;
                option.textContent = resource;
                resourceSelect.appendChild(option);
            });
        }

        function generateData(resource, quantityResourceSelect) {
            const nodes = [], links = [];
            const visited = new Set();

            function processResource(res, qty, linkInfo) {
                console.log("processResource test "+res);
                if (visited.has(res)) return;
                visited.add(res);
                console.log("processResource "+res);

                const building = buildingsMapByOutput[res]?.[0];
                if (building){
                    console.log("BUILD FOUND "+building.id + " prod: " + building.output.qty +  " caller "+linkInfo);

                    const numberOfBuilding = Math.ceil(qty / building.output.qty);

                    nodes.push({ id: building.id, label: building.id + " x " + numberOfBuilding, width: 140, height: 40 });

                    if (linkInfo){
                        console.log("LINK ADDED " + building.id + " " + linkInfo.dst);
                        links.push({ source: building.id, target: linkInfo.dst, label: `${linkInfo.name} x ${linkInfo.qty}` });
                    }

                    building.inputs.forEach(input => {

                        const inputId = input.name;
                        console.log("INPUT FOUND "+inputId);

                        const requiredInput = (input.qty / building.output.qty) * qty;  //scale the input based on the requested output

                        const linkInfo = { name: input.name, qty: requiredInput, dst: building.id };

                        //if (!nodes.find(n => n.id === inputId)) {
                        //    nodes.push({ id: inputId, label: `${input.name} x ${numberOfBuilding}`, width: 100, height: 40 });
                        //    console.log("NODE ADDED "+inputId);
                        //}
                        //links.push({ source: inputId, target: building.id, label: `${input.name} x ${qty}` });
                        //console.log("LINK ADDED " + inputId + " " + building.id);

                        processResource(input.name, requiredInput, linkInfo);
                    });
                }
            }

            const id = `OUTPUT: ${resource} ${quantityResourceSelect}`;
            const linkInfo = { name: resource, qty: quantityResourceSelect, dst: id };
            nodes.push({ id: id, label: id, width: 140, height: 40, color: "red" });
            processResource(resource, quantityResourceSelect, linkInfo);
            return { nodes, links };
        }

        // function generateData(resource, quantityResourceSelect) {
        //     const nodes = [], links = [];
        //     const factoryCount = 10;
        //
        //     buildingsMapByOutput[resource].forEach(building => {
        //         nodes.push({ id: building.id, width: 140, height: 40 });
        //         building.inputs.forEach(input => {
        //             const inputId = `${input.name}`;
        //             if (!nodes.find(n => n.id === inputId)) {
        //                 nodes.push({ id: inputId, width: 100, height: 40 });
        //             }
        //             links.push({ source: inputId, target: building.id, label: `${input.qty * factoryCount} ${input.name}` });
        //         });
        //     });
        //     return { nodes, links };
        // }
        var simulation = {};

        function updateGraph() {
            const selectedResource = document.getElementById("resource").value;
            const quantityResourceSelect = document.getElementById("quantity").value;

            const data = generateData(selectedResource, quantityResourceSelect);
            svg.selectAll("*").remove();

            simulation = d3.forceSimulation(data.nodes)
                .force("link", d3.forceLink(data.links).id(d => d.id).distance(200))
                .force("charge", d3.forceManyBody().strength(-500))
                .force("center", d3.forceCenter(width / 2, height / 2));

            const link = svg.selectAll(".link")
                .data(data.links)
                .enter().append("line")
                .attr("class", "link");

            const node = svg.selectAll(".node")
                .data(data.nodes)
                .enter().append("g")
                .attr("class", "node")
                .call(d3.drag()
                    .on("start", dragStarted)
                    .on("drag", dragged)
                    .on("end", dragEnded));

            node.append("rect")
                .attr("width", d => d.width)
                .attr("height", d => d.height)
                .attr("x", d => -d.width / 2)
                .attr("y", d => -d.height / 2)
                .style("fill",  d => d.color || "blue");

            node.append("text")
                .text(d => d.label)
                .attr("dy", 5);

            const linkLabels = svg.selectAll(".label")
                .data(data.links)
                .enter().append("text")
                .attr("class", "label")
                .text(d => d.label);

            simulation.on("tick", () => {
                link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
                    .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
                node.attr("transform", d => `translate(${d.x},${d.y})`);
                linkLabels.attr("x", d => (d.source.x + d.target.x) / 2)
                    .attr("y", d => (d.source.y + d.target.y) / 2);
            });
        }

        function dragStarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragEnded(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        fetch("https://raw.githubusercontent.com/lestofante/WorkerAndResourceCalculator/refs/heads/development/building.csv")
            .then(response => response.text())
            .then(data => parseCSV(data));
    </script>
</body>
</html>
